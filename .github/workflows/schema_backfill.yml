name: "StartGG: Schema Version Backfill"

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      max_events:
        description: "Maximum number of events to re-download in this run."
        required: false
        default: "200"
      batch_size:
        description: "Number of events to process per commit."
        required: false
        default: "20"

concurrency:
  group: chore-update-branch
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  schema-backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare chore-update branch
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin chore-update || true
          if git show-ref --verify --quiet refs/remotes/origin/chore-update; then
            git checkout -B chore-update origin/chore-update
          else
            git checkout -B chore-update
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip requests

      - name: Run tests
        run: |
          set -euxo pipefail
          python -m unittest scripts.test.test_validate_data
          python -m unittest scripts.test.test_backfill_schema_version

      - name: Backfill outdated event schema versions in batches
        id: backfill
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
        run: |
          set -uxo pipefail
          MAX_EVENTS="${{ inputs.max_events }}"
          if [ -z "$MAX_EVENTS" ]; then
            MAX_EVENTS="200"
          fi
          BATCH_SIZE="${{ inputs.batch_size }}"
          if [ -z "$BATCH_SIZE" ]; then
            BATCH_SIZE="20"
          fi

          ANY_CHANGES="false"
          TOTAL_PROCESSED=0
          SCRIPT_FAILED=0

          while [ "$TOTAL_PROCESSED" -lt "$MAX_EVENTS" ]; do
            REMAINING=$((MAX_EVENTS - TOTAL_PROCESSED))
            THIS_BATCH=$((REMAINING < BATCH_SIZE ? REMAINING : BATCH_SIZE))

            echo "=== batch start: processed_so_far=$TOTAL_PROCESSED max_events=$THIS_BATCH ==="
            OUTPUT="$(python scripts/fetch/backfill_schema_version.py \
              --token "$STARTGG_TOKEN" \
              --max_events "$THIS_BATCH" 2>&1)"
            SCRIPT_EXIT=$?
            echo "$OUTPUT"

            # 途中で失敗しても、そのバッチ内で正常に取得できた分は commit & push して残す。
            if ! git diff --quiet; then
              ANY_CHANGES="true"
              git add -A
              git commit -m "chore(data): backfill event schema version (batch)"
              PUSHED=0
              for attempt in 1 2 3; do
                if git push --set-upstream origin chore-update; then
                  PUSHED=1
                  break
                fi
                git pull --rebase origin chore-update
              done
              if [ "$PUSHED" -ne 1 ]; then
                echo "push failed after retries" >&2
                echo "any_changes=$ANY_CHANGES" >> "$GITHUB_OUTPUT"
                exit 1
              fi
            fi

            if [ "$SCRIPT_EXIT" -ne 0 ]; then
              echo "Batch failed (exit=$SCRIPT_EXIT); stopping further batches this run."
              SCRIPT_FAILED=1
              break
            fi

            BATCH_PROCESSED="$(echo "$OUTPUT" | grep -oE 'processed=[0-9]+' | tail -1 | cut -d= -f2)"
            BATCH_PROCESSED="${BATCH_PROCESSED:-0}"
            TOTAL_PROCESSED=$((TOTAL_PROCESSED + BATCH_PROCESSED))

            if [ "$BATCH_PROCESSED" -eq 0 ]; then
              echo "No more eligible events; stopping."
              break
            fi
          done

          echo "any_changes=$ANY_CHANGES" >> "$GITHUB_OUTPUT"

          if [ "$SCRIPT_FAILED" -ne 0 ]; then
            exit 1
          fi

      - name: Ensure main PR exists without auto-merge
        if: always() && steps.backfill.outputs.any_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          PR_NUMBER="$(gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --head chore-update \
            --base main \
            --state open \
            --json number \
            --jq '.[0].number // empty')"

          if [ -z "$PR_NUMBER" ]; then
            PR_URL="$(gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head chore-update \
              --title "chore(data): sync chore-update into main" \
              --body "Automated data update PR from \`chore-update\` into \`main\`." )"
            PR_NUMBER="${PR_URL##*/}"
          fi
          echo "PR #$PR_NUMBER is ready for manual review and merge."

      - name: Debug on failure
        if: failure()
        run: |
          echo "Workflow failed."
          git status --porcelain
          ls -la data/startgg
