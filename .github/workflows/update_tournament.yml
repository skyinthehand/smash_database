name: "StartGG: Update Tournament"

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: main-data-commits
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip requests

      - name: Download tournaments (JP only)
        id: download_tournaments
        env:
          STARTGG_TOKEN: ${{ secrets.STARTGG_TOKEN }}
        run: |
          set -euxo pipefail
          CURSOR_FILE="data/startgg/tournament_fetch_cursor.txt"
          TODAY_JST="$(TZ=Asia/Tokyo date +%F)"
          YESTERDAY_JST="$(TZ=Asia/Tokyo date -d '1 day ago' +%F)"

          if [ -f "$CURSOR_FILE" ]; then
            FINISH_DATE="$(cat "$CURSOR_FILE")"
          else
            FINISH_DATE="$YESTERDAY_JST"
          fi
          echo "finish_date=$FINISH_DATE" >> "$GITHUB_OUTPUT"
          echo "today_jst=$TODAY_JST" >> "$GITHUB_OUTPUT"

          python scripts/fetch/download.py \
            --token "$STARTGG_TOKEN" \
            --country_code "JP" \
            --finish_date "$FINISH_DATE" \
            2>&1 | tee /tmp/download_tournaments.log

          # download.pyが正常終了した場合のみここに到達する(set -euxo pipefailにより、
          # 失敗・中断時はここに到達せずカーソルは前回の値のまま残るため、
          # 次回実行時に自動的にこの区間を再走査して追いつく)。
          # ただし run 全体が成功しても、個々のトーナメント/イベントの取得が
          # 完了しなかった場合がある(download_all_tournaments() は、トーナメント
          # 単位の FetchError だけでなく、イベント単位の MaxPagesExceededError/
          # NoPhaseError/逐次取得の未完了もすべて incomplete_count に数えて
          # ログに出しつつ処理を継続するため、run 自体は正常終了する)。
          # incomplete_count が 0 のときだけカーソルを進め、1件でもあれば
          # 進めない(判定不能な場合もfail-closedで進めない)。
          INCOMPLETE="$(grep -oE 'incomplete_count=[0-9]+' /tmp/download_tournaments.log | tail -1 | cut -d= -f2)" || INCOMPLETE=""
          echo "incomplete_count=${INCOMPLETE:-unknown}" >> "$GITHUB_OUTPUT"

          if [ "$INCOMPLETE" = "0" ]; then
            echo "$YESTERDAY_JST" > "$CURSOR_FILE"
            echo "1件も取りこぼさず取得できたため、カーソルを $YESTERDAY_JST まで進めます。"
          else
            echo "[WARN] incomplete_count=${INCOMPLETE:-unknown} のため、カーソルは進めません" \
                 "(次回も [$FINISH_DATE, 今日] を再走査し、未完了だったトーナメント/イベントに再挑戦します)。" >&2
            {
              echo "## :warning: 一部トーナメント/イベントの取得が完了しませんでした"
              echo "incomplete_count=${INCOMPLETE:-unknown} 件。カーソルは進めていません。"
              echo "詳細は本ステップのログを確認してください。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run tests
        run: |
          set -euxo pipefail
          python -m unittest scripts.test.test_validate_data

      - name: Update chore tournament log
        run: |
          set -euxo pipefail
          python scripts/fix/update_chore_tournament_log.py \
            --mark-start "${{ steps.download_tournaments.outputs.finish_date }}" \
            --mark-end "${{ steps.download_tournaments.outputs.today_jst }}" \
            --workflow "update_tournament"

      - name: Detect changes
        id: detect_changes
        run: |
          set -euxo pipefail
          # git diff --quiet だけでは新規追加された未追跡ファイル(初回作成時の
          # tournament_fetch_cursor.txt 等)を検知できないため、git status --porcelain
          # で追跡外ファイルの追加も含めて判定する。
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "changed_files_count=0" >> "$GITHUB_OUTPUT"
            echo "No changes to create PR."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "changed_files_count=$(git status --porcelain | wc -l | tr -d ' ')" >> "$GITHUB_OUTPUT"
            git status --short
          fi

      - name: Commit changes
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          set -euxo pipefail
          git add -A
          git commit -m "chore(data): update tournament data"

      - name: Push to main
        if: steps.detect_changes.outputs.has_changes == 'true'
        run: |
          set -euxo pipefail
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git pull --rebase origin main
          done
          exit 1

      - name: Debug on failure
        if: failure()
        run: |
          echo "Workflow failed."
          git status --porcelain
          ls -la data/startgg
